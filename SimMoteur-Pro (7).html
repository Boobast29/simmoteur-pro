<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimMoteur Pro — Simulateur pédagogique de gestion moteur</title>
<style>
:root{
  --bg:#0a0e16; --bg2:#0f1420; --bg3:#141a28; --bg4:#1a2233; --bg5:#222c42;
  --border:#283549; --border2:#34425c;
  --text:#f0f5fb; --text2:#aebdd1; --text3:#7d8da3;
  --accent:#2dd4bf;   /* teal — identité */
  --accent2:#f43f5e;  /* rose — alerte/sport */
  --amber:#f59e0b; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --violet:#a78bfa; --cyan:#22d3ee;
  --r:14px; --r-sm:9px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
.theme-clair{
  --bg:#eef2f7; --bg2:#e6ecf3; --bg3:#fff; --bg4:#f1f5fa; --bg5:#e9eef5;
  --border:#d6dee9; --border2:#c4d0de;
  --text:#16202e; --text2:#475569; --text3:#8595a8;
  --shadow:0 8px 24px rgba(15,30,60,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
button{font-family:inherit}
input,select{font-family:inherit;color:var(--text)}

/* ====== LAYOUT ====== */
#app{display:flex;height:100vh}
#sidebar{width:272px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
#sidebar .logo{padding:16px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border);background:var(--bg3)}
#sidebar .logo .mk{font-size:22px;filter:drop-shadow(0 0 10px var(--accent))}
#sidebar .logo b{font-size:15px;letter-spacing:-.3px;background:linear-gradient(120deg,var(--accent),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#sidebar .logo small{display:block;font-size:9.5px;color:var(--text3);letter-spacing:.5px;font-weight:600;margin-top:1px}
#sidebar nav{flex:1;overflow-y:auto;padding:8px 0 16px}
.nav-group-title{padding:15px 20px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.6px;color:var(--text3);font-weight:800}
.nav-item{display:flex;align-items:center;gap:12px;margin:2px 10px;padding:10px 13px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);font-weight:600;font-size:14px;transition:background .15s,color .15s;position:relative}
.nav-item .ic{width:22px;text-align:center;font-size:17px;flex-shrink:0}
.nav-item:hover{background:var(--bg4);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent);color:var(--text)}
.nav-item.active::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nav-item .pill{margin-left:auto;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;background:var(--accent2);color:#fff}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:54px}
#topbar .tele{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#topbar .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--text2)}
.stat b{color:var(--text);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#566;flex-shrink:0}
.dot.on{background:var(--green);box-shadow:0 0 9px var(--green)}
.dot.warn{background:var(--amber);box-shadow:0 0 9px var(--amber);animation:bl 1.1s infinite}
.dot.crit{background:var(--red);box-shadow:0 0 9px var(--red);animation:bl .55s infinite}
@keyframes bl{50%{opacity:.25}}
#content{flex:1;overflow-y:auto;padding:22px 26px 70px;scroll-behavior:smooth}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ====== ATOMS ====== */
.btn{border:1px solid var(--border2);background:var(--bg4);color:var(--text);padding:9px 15px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:var(--bg5)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.xs{padding:4px 9px;font-size:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04211d;box-shadow:0 3px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.ghost{background:transparent}
.btn.act{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.badge.teal{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.badge.amber{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.badge.red{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.badge.green{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.badge.gray{background:var(--bg5);color:var(--text2)}
.badge.violet{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet)}

input[type=range]{-webkit-appearance:none;height:6px;border-radius:6px;background:var(--bg5);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=number],input[type=text],select{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12.5px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text2);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{position:relative;width:40px;height:22px;flex-shrink:0}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:var(--bg5);border-radius:20px;transition:.2s;border:1px solid var(--border2)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text3);transition:.2s}
.switch input:checked + i{background:color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px);background:var(--accent)}

/* ====== CARD / GRID ====== */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card .ch{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:14px;color:var(--text)}
.card .ch .ic{font-size:17px}
.card .ch .sub{margin-left:auto;font-size:12.5px;color:var(--text3);font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.g5,.g6{grid-template-columns:repeat(4,1fr)} .g4{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)} .g2{grid-template-columns:1fr}}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap;padding-left:14px;border-left:3px solid var(--accent)}
.page-head h1{font-size:25px;letter-spacing:-.4px;font-weight:800}
.page-head p{color:var(--text2);font-size:14px;margin-top:5px;line-height:1.55;max-width:780px}
.page-head .eyebrow{color:var(--accent)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}

/* mini widget */
.mw{background:var(--bg4);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mw .lbl,.mw .mw-l{font-size:11.5px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw .val,.mw .mw-v{font-size:23px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mw .val small,.mw .mw-v small{font-size:13px;color:var(--text3);font-weight:600}
.mw.ok{border-left:4px solid var(--green)} .mw.warn{border-left:4px solid var(--amber)} .mw.crit{border-left:4px solid var(--red)}

/* voyant */
.voy{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 8px}
.voy .led{width:17px;height:17px;border-radius:50%;background:#3a4252;transition:.2s}
.voy .led.on-amber{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.voy .led.on-red{background:var(--red);box-shadow:0 0 12px var(--red);animation:bl .6s infinite}
.voy .led.on-green{background:var(--green);box-shadow:0 0 10px var(--green)}
.voy .t{font-size:11.5px;color:var(--text2);font-weight:600;text-align:center;line-height:1.25}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 13px;color:var(--text2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;border-bottom:1px solid var(--border)}
td{padding:11px 13px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg4)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* sensor card */
.sensor{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.sensor.s-warn{border-color:color-mix(in srgb,var(--amber) 55%,var(--border))}
.sensor.s-crit{border-color:color-mix(in srgb,var(--red) 60%,var(--border))}
.sensor .top{display:flex;align-items:flex-start;gap:8px}
.sensor .ac{font-family:var(--mono);font-weight:800;font-size:15px}
.sensor .nm{font-size:12px;color:var(--text2);font-weight:600;line-height:1.3}
.sensor .st{margin-left:auto;font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;text-transform:uppercase;white-space:nowrap}
.sensor .vrow{display:flex;align-items:baseline;gap:6px}
.sensor .v{font-size:27px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.sensor .u{font-size:13px;color:var(--text3);font-weight:600}
.sensor canvas{width:100%;height:44px;display:block}
.sensor .bar{height:7px;border-radius:4px;background:var(--bg5);overflow:hidden;position:relative}
.sensor .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.sensor .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-family:var(--mono)}
.sensor .selec{background:var(--bg5);border:1px solid var(--border);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.sensor .selec .sk-lbl{font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.sensor .erow{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.sensor .erow b{font-family:var(--mono);font-weight:700;color:var(--text2);font-size:11.5px;text-align:right}
.sensor .actbar{display:flex;gap:5px;flex-wrap:wrap}

/* gauge wrap */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge-wrap canvas{display:block}
.gauge-wrap .gv{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:-1px;margin-top:-14px}
.gauge-wrap .gu{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px}

/* scope */
.scope{background:#05070c;border:1px solid var(--border);border-radius:var(--r);padding:8px}
.scope canvas{width:100%;display:block;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg4);cursor:pointer;user-select:none}
.chip .sw{width:11px;height:11px;border-radius:3px}
.chip.off{opacity:.4}
.chip.on{background:color-mix(in srgb,var(--accent) 20%,var(--bg4));border-color:var(--accent);color:var(--text)}
.chip:hover{border-color:var(--accent)}
.filterbar{display:flex;flex-direction:column;gap:9px}
.filterbar .fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filterbar .fb-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);min-width:74px}
.filterbar .chip{font-size:12px;padding:6px 11px}
.chip i{width:11px;height:11px;border-radius:3px;display:inline-block;opacity:.35}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--bg4))}
.chip.on i{opacity:1}

/* misc */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.kv:last-child{border:0}
.kv span{color:var(--text2)} .kv b{font-family:var(--mono)}
.note{font-size:13px;color:var(--text2);line-height:1.55}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--bg5);color:var(--text2)}
.veh-card,.scn-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:9px}
.veh-card:hover,.scn-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.veh-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.veh-card .vn{font-weight:700;font-size:15px}
.veh-card .spec{display:flex;gap:6px;flex-wrap:wrap}
.bars2{display:grid;grid-template-columns:auto 1fr auto;gap:7px 11px;align-items:center;font-size:12.5px}
.bars2 .b{height:8px;border-radius:5px;background:var(--bg5);overflow:hidden}
.bars2 .b i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg5);border:1px solid var(--accent);color:var(--text);padding:12px 22px;border-radius:10px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;bottom:28px}
.help-q{cursor:help;color:var(--text3);border:1px solid var(--border2);border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
details.acc{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--bg3)}
details.acc summary{padding:12px 15px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--border)}
details.acc .body{padding:14px 15px}
.flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.flow .node{background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;text-align:center;min-width:84px;font-size:12.5px;font-weight:600}
.flow .node .nv{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent)}
.flow .arr{color:var(--text3);font-size:19px}
.flow .node.on{background:color-mix(in srgb,var(--accent) 22%,var(--bg4));border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent)}
/* sidebar : recherche + groupes pliables */
#nav .nav-search{margin:10px 14px 6px;position:relative}
#nav .nav-search input{width:100%;background:var(--bg4);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px 8px 30px;font-size:13px}
#nav .nav-search::before{content:"🔎";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
.nav-group{margin-top:2px}
.nav-group-title{display:flex;align-items:center;gap:8px;padding:13px 18px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);font-weight:800;cursor:pointer;user-select:none}
.nav-group-title .gic{font-size:13px;filter:none;letter-spacing:0}
.nav-group-title .chev{margin-left:auto;font-size:9px;transition:transform .2s;opacity:.6}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group.collapsed .nav-item{display:none!important}
.nav-group-title .gcount{font-size:9px;background:var(--bg5);border-radius:8px;padding:1px 6px;color:var(--text3);letter-spacing:0}
#sidebar .logo .sb-tools{margin-left:auto;display:flex;gap:4px}
#sidebar .logo .sb-tools button{background:var(--bg4);border:1px solid var(--border);color:var(--text2);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px}
#sidebar .logo .sb-tools button:hover{color:var(--text);border-color:var(--accent)}
/* densité compacte */
body.dense .card{padding:11px 13px!important}
body.dense .nav-item{padding:7px 12px;font-size:13px;margin:1px 10px}
body.dense #content{padding:16px!important}
body.dense .ch{margin-bottom:7px}
/* hub d'accueil */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hub-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;display:flex;flex-direction:column}
.hub-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hub-card .hc-head{display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:800;font-size:14.5px;border-bottom:1px solid var(--border);background:var(--bg4)}
.hub-card .hc-head .hic{font-size:20px}
.hub-card .hc-body{padding:12px 15px;font-size:12.5px;color:var(--text2);flex:1;line-height:1.5}
.hub-card .hc-links{display:flex;flex-wrap:wrap;gap:5px;padding:0 15px 13px}
.hub-card .hc-links span{font-size:11px;background:var(--bg5);border:1px solid var(--border);border-radius:7px;padding:3px 8px;color:var(--text2)}
.hub-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--bg3)),var(--bg3));border:1px solid var(--border2);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.hub-stat{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:92px}
.hub-stat .hv{font-family:var(--mono);font-weight:800;font-size:20px;color:var(--accent)}
.hub-stat .hl{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><span class="mk">🔧</span><div><b>SimMoteur Pro</b><small>SIMULATEUR PÉDAGOGIQUE · HORS LIGNE</small></div><div class="sb-tools"><button onclick="App.toggleDensity()" title="Densité d'affichage">⇕</button><button onclick="App.toggleAllGroups()" title="Replier / déplier les menus">≡</button></div></div>
    <nav id="nav"></nav>
  </aside>
  <div id="main">
    <div id="topbar">
      <div class="tele">
        <div class="stat"><span class="dot" id="t-ecu"></span>ECU&nbsp;<b id="t-ecustate">—</b></div>
        <div class="stat"><span class="dot" id="t-eng"></span>Moteur&nbsp;<b id="t-engstate">arrêté</b></div>
        <div class="stat">RPM&nbsp;<b id="t-rpm">0</b></div>

 /* ---------- BOUCLE DE SIMULATION ---------- */
 sim(){
  const s=this.state, dt=0.06;
  // pression atmosphérique selon altitude
  s.baro = 101.3*Math.pow(1-2.25577e-5*s.altitude,5.2559);
  // mode démo : pilote tout seul
  if(s.demo && s.engineRunning){
   s.pedal = 22 + Math.sin(Date.now()/2600)*32 + Math.max(0,Math.sin(Date.now()/9000))*25;
   s.pedal = Math.max(0,Math.min(100,s.pedal));
   if(Math.random()<0.004) s.gear=Math.min(this.maxGear(),s.gear+ (Math.random()<0.7?1:-1));
   s.gear=Math.max(0,s.gear);
  }
  // mode stress : bruit + pannes aléatoires
  if(s.mode==='stress' && s.engineRunning && Math.random()<0.004){ this.randomFault(); }

  const fx=(s.activeScenario&&s.activeScenario.fx)||{};
  // charge accessoires (clim, phares, dégivrage)
  const accAmp = (s.ac?28:0)+(s.lights?12:0)+(s.rear?22:0);
  const acLoad = s.ac?8:0;
  // coup de gaz (blip) : impulsion temporaire de pédale
  if(this._blip>0){ this._blip--; s.pedal=Math.max(s.pedal,55+this._blip*1.5); }
  // ----- RÉGIME -----
  if(s.engineRunning){
   const idle=s.targetIdle + (s.ac?120:0), max=s.rpmMax;
   let target=idle + (s.pedal/100)*(max-idle);
   if(fx.idleHigh && s.pedal<3) target=idle+450;
   // limiteur
   if(target>max) target=max;
   // mode dégradé : limitation régime
   if(s.degraded) target=Math.min(target, idle+ (max-idle)*0.55);
   let k=(0.10 + s.pedal/600)*(s.tune?s.tune.revResp:1);
   s.rpm += (target-s.rpm)*k;
   // instabilité (pannes ralenti / prise d'air)
   const inst=fx.unstable||0;
   if(s.pedal<6 && inst){ s.rpm += Math.sin(Date.now()/120)*inst*1.3 + (Math.random()-0.5)*inst; }
   s.rpm += (Math.random()-0.5)*6;
   if(s.rpm>=max){s.rpm=max-60;}
   s.rpm=Math.max(s.engineRunning?Math.max(300,idle-300):0, s.rpm);
  } else if(!s.starter){ s.rpm += (0-s.rpm)*0.18; if(s.rpm<20)s.rpm=0; }

  // ----- CHARGE / PAPILLON -----
  s.throttlePlate += (((fx.idleHigh&&s.pedal<3)?12:s.pedal) - s.throttlePlate)*0.25;
  let load = s.engineRunning ? Math.min(100, 6 + s.pedal*0.92 + (s.rpm/s.rpmMax)*8 + acLoad) : 0;
  if(s.degraded) load=Math.min(load,70);
  s.load += (load-s.load)*0.2;

  // ----- ADMISSION : MAP / boost / MAF -----
  if(s.engineRunning){
   let mapBase = s.baro*(0.30 + 0.70*(s.load/100));   // dépression au ralenti → atmo à pleine charge
   // turbo
   if(s.turbo && !fx.noBoost && s.rpm>1500 && s.load>25){
    let bTarget=(s.boostCible||1)*(s.tune?s.tune.boostMul:1)*Math.min(1,(s.rpm-1500)/1800)*(s.load/100);
    if(fx.overboost) bTarget*=1.8;
    if(fx.fapClog) bTarget*=0.7;
    s.boost += (bTarget-s.boost)*(fx.boostLag?0.035:0.12)*(s.tune?s.tune.turboResp:1);
   } else { s.boost += (0-s.boost)*0.15; }
   s.boost=Math.max(0,s.boost);
   if(fx.noBoost) s.boost=0;
   s.map = mapBase + s.boost*100;
   s.wgDuty = s.turbo? Math.max(0,Math.min(100, 80 - (s.boost/(s.boostCible||1))*70)) : 0;
   if(fx.noBoost) s.wgDuty=100;
   if(fx.overboost) s.wgDuty=5;
   // MAF ∝ map * rpm * cylindrée
   s.maf = (s.map/100)*(s.rpm/1000)*(s.disp/1000)*11.5;
   if(fx.lean) s.maf*=0.78; // air non mesuré (prise d'air) → MAF sous-estime
  } else { s.map += (s.baro-s.map)*0.2; s.boost*=0.9; s.maf*=0.85; }

  // ----- RICHESSE / COMBUSTION -----
  let afrT=s.afrCible;
  if((s.ect<40 || fx.thermoOpen) && s.engineRunning) afrT*=0.86;   // enrichissement à froid (ou thermostat ouvert)
  if(s.load>85) afrT*=0.92;                            // enrichissement pleine charge
  if(fx.lean) afrT*=1.18;                              // mélange pauvre (panne)
  if(fx.rich) afrT*=0.80;                              // mélange trop riche (injecteur qui fuit)
  s.afr += (afrT - s.afr)*0.15;
  if(s.engineRunning) s.afr += Math.sin(Date.now()/300)*0.25; // oscillation boucle fermée
  s.lambda = s.afr/(s.fuel==='diesel'?14.5:(s.fuel==='E85'?9.76:14.7));
  // combustion / stabilité
  let combTarget=100;
  if(fx.misfire) combTarget-=35;
  if(fx.lean) combTarget-=15;
  if(fx.egrStuck && s.pedal<10) combTarget-=30;
  if(fx.knock) combTarget-=12;
  s.combustion += (combTarget-s.combustion)*0.1;
  let stabTarget = 100 - (fx.unstable||0) - (fx.misfire?25:0) - (s.ect<30&&s.engineRunning?10:0);
  s.stability += (Math.max(0,stabTarget)-s.stability)*0.12;

  // ----- CLIQUETIS -----
  let knockTarget=0;
  const octane = {SP95:95,SP98:98,E10:95,E85:104,diesel:0}[s.fuel]||95;
  if(s.engineRunning && s.fuel!=='diesel'){
   knockTarget = Math.max(0, (s.load-55)*0.8 + (s.ignAdvance-12)*3 + (s.iat-40)*0.5 + (95-octane)*1.5);
   if(fx.knock) knockTarget+=55;
   knockTarget=Math.max(0,Math.min(100,knockTarget));
  }
  s.knock += (knockTarget-s.knock)*0.2;
  // stratégie anti-cliquetis : retard d'allumage (capteur HS → retard de sécurité permanent)
  s.ignAdvance = 12 + (s.rpm/s.rpmMax)*16 - (s.load/100)*6 - (s.knock>30?(s.knock-30)*0.15:0) - (fx.knockSafe?7:0);

  // ----- THERMIQUE -----
  if(s.engineRunning){
   let heat = (0.18 + (s.load/100)*0.55)*(s.tune?s.tune.warmRate:1);
   if(fx.coolantLoss) heat += 0.35;                       // perte de liquide → chauffe plus vite
   let cool = (s.ect>70?0.12:0.04) * (s.fan1?1.8:1) * (s.fan2?2.6:1) * (s.speed>20?1.3:1) * (s.tune?s.tune.coolRate:1);
   if(fx.thermoOpen) cool *= 3.2;                          // thermostat bloqué ouvert → refroidit trop
   if(fx.noFan){s.fan1=false;s.fan2=false;}
   s.ect += (heat-cool)*1.6;
   if(fx.thermoOpen && s.ect>72) s.ect=72;                 // n'atteint jamais la température
   if(s.ect<s.ambient) s.ect=s.ambient;
   // ventilateurs auto
   if(!fx.noFan){ s.fan1 = s.ect>97; s.fan2 = s.ect>103; }
   s.oilTemp += ((s.ect+12)-s.oilTemp)*0.02 + (s.load/100)*0.05;
   // EGT
   let egtT = 200 + (s.load/100)*650 + (s.afr>afrT+1?120:0) + (s.boost*60);
   if(fx.hotEgt) egtT+=180;
   s.egt += (egtT-s.egt)*0.06;
  } else {
   s.ect += (s.ambient-s.ect)*0.004;
   s.oilTemp += (s.ambient-s.oilTemp)*0.003;
   s.egt += (s.ambient+30-s.egt)*0.02;
  }
  s.iat = s.ambient + (s.boost>0?s.boost*12:0) + (s.engineRunning?3:0);

  // ----- CARBURANT -----
  s.injDuty = s.engineRunning? Math.min(95, 2 + (s.maf/ (s.afr||14.7))*4 + s.load*0.2) : 0;
  let railT = s.fuel==='diesel'? (300 + s.load*14) : (50 + s.load*1.5 + s.boost*30);
  if(fx.railLow) railT*=0.45;
  s.rail += (railT-s.rail)*0.15 + ((fx.unstable&&s.activeScenario.id==='s_carb_rail')?(Math.random()-0.5)*40:0);
  s.fuelLP = (fx.railLow||fx.lpLow)? 1.8+Math.random()*0.3 : 4 + Math.sin(Date.now()/800)*0.2;
  if(s.engineRunning && s.fuelLevel>0){ s.fuelLevel -= s.conso*0.00005; }

  // ----- ÉLECTRIQUE -----
  if(s.engineRunning){
   if(fx.altDead){ s.alt=0; } else { s.alt = 30 + s.load*0.3 + (s.fan1?20:0)+(s.fan2?30:0) + accAmp; }
   let vT = fx.altDead? Math.max(11.4, s.vbat-0.002) : (fx.batLow?12.0:14.1) - accAmp*0.004;
   s.vbat += (vT-s.vbat)*0.05;
   if(fx.altRipple) s.vbat += Math.sin(Date.now()/60)*0.45 + (Math.random()-0.5)*0.2; // ondulation diodes
  } else { s.alt=0; s.vbat += ((s.starter?9.8:12.5)-s.vbat)*0.1; }
  s.ref5 = fx.ref5bad? 4.2+Math.sin(Date.now()/200)*0.6 : 5.0+(Math.random()-0.5)*0.02;
  s.massQ = fx.ref5bad? 70 : 100;

  // ----- EMISSIONS / EGR / VVT -----
  let egrT = (s.engineRunning && s.load>15 && s.load<70 && s.pedal>5)? 25 : 0;
  if(fx.egrStuck) egrT=80;
  if(fx.egrClosed) egrT=0;
  s.egr += (egrT-s.egr)*0.1;
  let vvtT = s.engineRunning? Math.min(40,(s.rpm-1200)/120) : 0;
  if(fx.vvtFault) vvtT=2;
  s.vvtIn += (Math.max(0,vvtT)-s.vvtIn)*0.1;
  s.vvtEx += (Math.max(0,vvtT*0.6)-s.vvtEx)*0.1;
  if(fx.fapClog) s.fapLoad=Math.min(100,s.fapLoad+0.02); else s.fapLoad=Math.max(10,s.fapLoad-(s.egt>550?0.05:0));

  // ----- COUPLE / PUISSANCE -----
  if(s.engineRunning){
   const v=this.veh();
   // courbe de couple normalisée (cloche)
   const rN=s.rpm/s.rpmMax;
   let curve = Math.max(0, 1 - Math.pow((rN-0.55)/0.55,2)*0.9);
   let tq = v.couple * curve * (s.load/100) * (s.tune?s.tune.torqueMul:1);
   tq *= (s.turbo? (1+s.boost*0.45) : 1);
   tq *= (s.combustion/100);
   tq *= (1 - s.knock/250);
   if(fx.knockSafe) tq*=0.82;       // retard de sécurité permanent
   if(s.degraded) tq*=0.6;
   if(fx.fapClog) tq*=0.75;
   s.torque += (tq-s.torque)*0.18;
   s.power = s.torque*s.rpm/7023; // ch
   s.wheelTorque = s.torque*(s.gear>0?s.gears[s.gear-1]*s.pont:0);
  } else { s.torque*=0.85; s.power*=0.85; s.wheelTorque=0; }

  // ----- VITESSE VÉHICULE (indicative, cohérente avec rpm/rapport) -----
  // passage automatique des rapports (optionnel)
  if(s.tune&&s.tune.autoShift && s.engineRunning && !s.clutch && !s.demo){
   if(s.rpm>s.rpmMax*0.82 && s.gear>0 && s.gear<this.maxGear()) s.gear++;
   else if(s.rpm<s.rpmMax*0.30 && s.gear>1) s.gear--;
   else if(s.gear===0 && s.pedal>5) s.gear=1;
  }
  if(s.engineRunning && s.gear>0 && !s.clutch){
   const ratio=s.gears[s.gear-1]*s.pont;
   const wheelRpm=s.rpm/ratio;
   const spd=wheelRpm*2*Math.PI*s.roue*60/1000;
   s.accel=(spd-s.speed); s.speed += (spd-s.speed)*0.08*(s.tune?s.tune.accelResp:1);
  } else { s.accel=-s.speed*0.05; s.speed=Math.max(0,s.speed-1.2*(s.tune?s.tune.brakeForce:1)); }
  s.speed=Math.max(0,s.speed);

  // ----- CONSOMMATION -----
  if(s.engineRunning){
   const flow=s.injDuty*0.012*(s.cyl/4)*(s.fuel==='diesel'?0.85:1); // L/h approx
   s.conso = s.speed>3? (flow/s.speed)*100 : flow*2.2; // L/100 ou L/h@ralenti
   s.consoSum+=s.conso; s.consoN++; s.consoAvg=s.consoSum/s.consoN;
  } else s.conso=0;

  // ----- SANTÉ / STRESS / SCORES -----
  s.thermalStress = Math.max(0,Math.min(100,(s.ect-95)*4 + (s.egt-800)*0.15 + (s.oilTemp-120)*2));
  let dmg=0;
  if(s.ect>112)dmg+=0.15; if(s.knock>50)dmg+=0.1; if(s.egt>950)dmg+=0.12; if(s.oilTemp>140)dmg+=0.1;
  if(dmg>0) s.health=Math.max(0,s.health-dmg); else s.health=Math.min(100,s.health+0.02);
  s.efficiency = Math.round(Math.max(0,Math.min(100, s.combustion*0.5 + (100-s.thermalStress)*0.25 + (s.lambda>0.95&&s.lambda<1.1?100:60)*0.25)));
  // cohérence capteurs
  const nf=Object.keys(s.sensorFaults).length;
  s.sensorCoherence=Math.max(0,100-nf*22-(fx.ref5bad?30:0));
  s.actuatorHealth=Math.max(0,100-(fx.noFan?20:0)-(fx.altDead?20:0)-(fx.egrStuck?15:0)-(s.degraded?10:0));

  // ----- TESTS ACTIONNEURS (valise diagnostic) -----
  const now=Date.now(), at=s.actTest||{};
  if(at['FAN1']>now){ s.fan1=true; s.ect=Math.max(s.ambient,s.ect-0.25); }
  if(at['FAN2']>now){ s.fan1=true; s.fan2=true; s.ect=Math.max(s.ambient,s.ect-0.5); }
  if(at['EGR']>now){ s.egr=Math.min(100,(s.egr||0)+60); }
  if(at['WG']>now){ s.wgDuty=Math.min(100,(s.wgDuty||0)+40); }
  if(at['FAP']>now){ s.fapLoad=Math.max(0,(s.fapLoad||0)-2); s.egt=Math.min(950,s.egt+5); }
  if(at['POMPE-CARB']>now){ s.fuelLP=Math.max(s.fuelLP,s.fuel==='diesel'?5:4.5); }

  // odomètre (km)
  s.odo=(s.odo||0)+s.speed*0.06/3600;

  // ----- ÉTAT ECU -----
  this.updateEcuState();
  // détection mode dégradé
  this.checkDegraded();
  // historiques
  this.pushHist();
  // alertes journal automatiques
  this.autoLog();
 },

 /* ---------- MACHINE D'ÉTAT ECU ---------- */
 updateEcuState(){
  const s=this.state;
  let st;
  if(!s.ignition) st='off';
  else if(s.starter) st='crank';
  else if(s.fuel==='diesel'&&s.ect<40&&!s.engineRunning) st='preheat';
  else if(!s.engineRunning) st='ignition';
  else if(s.degraded) st='limp';
  else if(s.pedal<3 && s.ect<55) st='idle_cold';
  else if(s.pedal<3) st='idle_hot';
  else if(s.pedal<6 && s.rpm>1600) st='dfco';      // coupure décélération
  else if(s.load>85) st='full';
  else st='partial';
  s.ecuState=st;
 },
 ECU_LABELS:{off:'Contact coupé',ignition:'Contact mis',preheat:'Préchauffage',crank:'Démarrage',
  idle_cold:'Ralenti à froid',idle_hot:'Ralenti à chaud',partial:'Charge partielle',full:'Pleine charge',
  dfco:'Coupure décélération',limp:'Mode dégradé'},

 checkDegraded(){
  const s=this.state; const fx=(s.activeScenario&&s.activeScenario.fx)||{};
  const crit = s.ect>110 || s.knock>70 || fx.overboost || (s.egt>980) || Object.values(s.sensorFaults).includes('open');
  if(crit && !s.degraded){ s.degraded=true; this.log('warn','Entrée en mode dégradé (protection moteur).'); }
  if(!crit && s.degraded && s.ect<105 && s.knock<40){ s.degraded=false; this.log('info','Sortie du mode dégradé.'); }
 },

 pushHist(){
  const s=this.state, H=s.hist;
  this.HIST_KEYS.forEach(k=>{ const a=H[k]; a.push(s[k]||0); if(a.length>240)a.shift(); });
 },

 /* ---------- LECTURE CAPTEUR (avec panne injectée) ---------- */
 readSensor(def){
  const s=this.state;
  let v=def.get(s);
  const f=s.sensorFaults[def.ac];
  let status='normal';
  if(f){
   if(f==='open'){ v=def.min; status='défaut'; }
   else if(f==='short'){ v=def.max; status='défaut'; }
   else if(f==='frozen'){ if(this._frozen==null)this._frozen={}; if(this._frozen[def.ac]==null)this._frozen[def.ac]=v; v=this._frozen[def.ac]; status='défaut'; }
   else if(f==='drift'){ v=v*1.25+ (def.max-def.min)*0.08; status='alerte'; }
   else if(f==='slow'){ v=v*0.6+def.min*0.4; status='alerte'; }
   else if(f==='noise'){ v=v+(Math.random()-0.5)*(def.max-def.min)*0.15; status='alerte'; }
  } else if(this._frozen) delete this._frozen[def.ac];
  // hors plage → alerte
  if(status==='normal'){
   if(v<def.min*1.001||v>def.max*0.999) status='alerte';
  }
  return {v, status, fault:f};
 },

 /* ---------- PANNES / DTC ---------- */
 randomFault(){
  const sc=SCENARIOS[Math.floor(Math.random()*SCENARIOS.length)];
  this.applyScenario(sc, false);
  this.toast('Panne injectée : '+sc.titre);
 },
 applyScenario(sc, fromMission){
  const s=this.state;
  s.activeScenario=sc;
  if(sc.fx.sensor){ s.sensorFaults[sc.fx.sensor[0]]=sc.fx.sensor[1]; }
  if(sc.fx.misfire) s._misfireCyl=sc.fx.misfire;
  this.addFault(sc.dtc, sc.panne, sc.diff==='expert'||sc.diff==='difficile'?'critique':(sc.diff==='moyen'?'majeur':'mineur'));
  this.captureFreeze();
  this.log('warn','Scénario actif : '+sc.titre+' ('+sc.dtc+')');
  if(this._currentPage) this.go(this._currentPage);
 },
 addFault(dtc,desc,grav){
  const s=this.state;
  let ex=s.faults.find(f=>f.dtc===dtc);
  if(ex){ ex.count++; ex.active=true; }
  else s.faults.push({dtc,desc,grav,active:true,count:1,t:Date.now()});
 },
 clearFaults(){
  const s=this.state;
  s.faults.filter(f=>f.active).forEach(f=>s.stored.push({...f,active:false,cleared:Date.now()}));
  s.faults=[]; s.activeScenario=null; s.sensorFaults={}; s._misfireCyl=null; s.degraded=false; s._frozen={};
  this.log('info','Défauts effacés.'); this.toast('Défauts effacés');
  this.go(this._currentPage);
 },
 injectSensorFault(ac,type){
  if(type==='none'){ delete this.state.sensorFaults[ac]; this.log('info','Capteur '+ac+' : panne retirée.'); }
  else { this.state.sensorFaults[ac]=type; this.log('warn','Panne capteur '+ac+' : '+this.FAULT_NAMES[type]); }
  if(this._currentPage==='sensors') this.go('sensors');
 },
 FAULT_NAMES:{open:'circuit ouvert',short:'court-circuit',frozen:'valeur figée',drift:'dérive lente',slow:'réponse lente',noise:'bruit parasite'},

 captureFreeze(){
  const s=this.state;
  s.freeze={t:new Date().toLocaleTimeString(),rpm:Math.round(s.rpm),load:Math.round(s.load),ect:Math.round(s.ect),
   map:Math.round(s.map),afr:s.afr.toFixed(1),lambda:s.lambda.toFixed(2),vbat:s.vbat.toFixed(1),
   boost:s.boost.toFixed(2),speed:Math.round(s.speed),knock:Math.round(s.knock),egt:Math.round(s.egt),
   dtc:s.faults.filter(f=>f.active).map(f=>f.dtc)};
 },

 /* ---------- MISSIONS ---------- */
 startMission(id){
  const sc=SCENARIOS.find(x=>x.id===id); if(!sc) return;
  const s=this.state;
  s.mission=sc; s.missionStart=Date.now(); s.missionHints=0; s.missionTries=0;
  this.clearFaults();
  this.applyScenario(sc,true);
  if(!s.engineRunning && !sc.fx.noStart) this.startEngine();
  this.log('info','Mission lancée : '+sc.titre);

 },
 useHint(){ this.state.missionHints++; this.go('missions'); },
 validateMission(guessId){
  const s=this.state; if(!s.mission) return;
  s.missionTries++;
  const ok = guessId===s.mission.id;
  const time=Math.round((Date.now()-s.missionStart)/1000);
  if(ok){
   let score=Math.max(20,100 - s.missionHints*12 - (s.missionTries-1)*15 - Math.floor(time/30)*4);
   this.log('success',`Diagnostic correct ! Score ${score}/100 (temps ${time}s, ${s.missionHints} indice(s), ${s.missionTries} essai(s)).`);
   this.toast('✅ Bon diagnostic — '+score+'/100');
   s._lastScore=score; s._missionDone=true;
  } else {
   this.log('error','Diagnostic incorrect, réessayez. ('+s.missionTries+' essai(s))');
   this.toast('❌ Ce n\'est pas la bonne panne');
  }
  this.go('missions');
 },

 /* ---------- DIVERS ---------- */
 resetAll(){

  this.stopEngine();
  const s=this.state;
  s.faults=[];s.stored=[];s.activeScenario=null;s.sensorFaults={};s._misfireCyl=null;s.degraded=false;
  s.ect=s.ambient;s.oilTemp=s.ambient;s.egt=120;s.knock=0;s.combustion=100;s.stability=100;s.health=100;
  s.thermalStress=0;s.vbat=12.6;s.rail=50;s.boost=0;s.pedal=0;s.gear=0;s.fuelLevel=80;s.fapLoad=10;
  s.mission=null;s.freeze=null;s.consoSum=0;s.consoN=0;s.consoAvg=0;s.mode='libre';s.demo=false;
  this.HIST_KEYS.forEach(k=>s.hist[k]=[]);

 log(type,msg){
  this.state.logs.unshift({type,msg,t:new Date().toLocaleTimeString()});

 },
 _lastAuto:{},
 autoLog(){
  const s=this.state, a=this._lastAuto;

  ev('fan',s.fan2,'info','Ventilateur grande vitesse enclenché.');

  ev('lowfuel',s.fuelLevel<12,'warn','Niveau carburant faible.');

 },
 toast(msg){

 },

 /* ---------- STOCKAGE / EXPORT ---------- */
 saveState(){ try{ const c={...this.state}; delete c.hist; localStorage.setItem('simmoteur-v2',JSON.stringify(c)); }catch(e){} },
 loadState(){ try{ const d=JSON.parse(localStorage.getItem('simmoteur-v2')); if(d){const hist=this.state.hist;Object.assign(this.state,d);this.state.hist=hist;} }catch(e){} },
 exportSession(){
  const c={...this.state}; delete c.hist;
  this._download('session-simmoteur.json', JSON.stringify(c,null,2));
  this.log('info','Session exportée (JSON).');
 },
 exportCSV(){
  const H=this.state.hist, keys=this.HIST_KEYS, n=H.rpm.length;
  let csv='index,'+keys.join(',')+'\n';
  for(let i=0;i<n;i++) csv+=i+','+keys.map(k=>(H[k][i]||0).toFixed(2)).join(',')+'\n';
  this._download('donnees-simmoteur.csv',csv);
  this.log('info','Données simulées exportées (CSV).');
 },
 importSession(input){

  r.onload=e=>{ try{ const d=JSON.parse(e.target.result); const hist=this.state.hist; Object.assign(this.state,d); this.state.hist=hist; this.log('success','Session importée.'); this.toast('Session importée'); this.go(this._currentPage);}catch(err){this.toast('Fichier invalide');} };
  r.readAsText(f);
 },
 _download(name,content){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'})); a.download=name; a.click(); },
 setTheme(t){ this.state.theme=t; document.body.className=(t==='clair'?'theme-clair':''); this.saveState(); },

 /* ============================================================
    RENDU — boucle, utilitaires canvas, topbar
    ============================================================ */
 renderLoop(){

  requestAnimationFrame(tick);
 },
 renderTopbar(){
  const s=this.state;
  const setT=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  setT('t-rpm',Math.round(s.rpm)); setT('t-spd',Math.round(s.speed)+' km/h');
  setT('t-ect',Math.round(s.ect)+'°'); setT('t-ecustate',this.ECU_LABELS[s.ecuState]);
  setT('t-engstate',s.engineRunning?'tournant':(s.starter?'lancement':'arrêté'));
  const de=document.getElementById('t-eng'); if(de) de.className='dot '+(s.engineRunning?'on':(s.starter?'warn':''));
  const du=document.getElementById('t-ecu'); if(du) du.className='dot '+(s.degraded?'crit':(s.ignition?'on':''));
 },
 // utilitaires dessin
 gauge(id,val,max,color,unit,label){
  const c=document.getElementById(id); if(!c)return; const ctx=c.getContext('2d');
  const w=c.width,h=c.height,cx=w/2,cy=h*0.82,r=Math.min(w/2,h)*0.86;
  ctx.clearRect(0,0,w,h);
  ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*0.85,Math.PI*2.15);ctx.strokeStyle='#1d2740';ctx.lineWidth=9;ctx.stroke();
  const frac=Math.max(0,Math.min(1,val/max));
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*0.85,Math.PI*0.85+frac*Math.PI*1.3);
  const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,color);g.addColorStop(1,'#fff');
  ctx.strokeStyle=color;ctx.lineWidth=9;ctx.stroke();
  // graduations
  for(let i=0;i<=10;i++){const a=Math.PI*0.85+(i/10)*Math.PI*1.3;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r-13),cy+Math.sin(a)*(r-13));ctx.lineTo(cx+Math.cos(a)*(r-6),cy+Math.sin(a)*(r-6));ctx.strokeStyle='#34425c';ctx.lineWidth=1.5;ctx.stroke();}
 },
 spark(id,arr,color,fill){
  const c=document.getElementById(id); if(!c)return; const ctx=c.getContext('2d');
  const w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2; ctx.scale(1,1);
  ctx.clearRect(0,0,w,h);
  if(!arr||arr.length<2)return;
  const recent=arr.slice(-60); let mn=Math.min(...recent),mx=Math.max(...recent); if(mx-mn<1e-6){mx=mn+1;}
  ctx.beginPath();
  recent.forEach((v,i)=>{const x=i/(recent.length-1)*w;const y=h-((v-mn)/(mx-mn))*(h-6)-3;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
  if(fill){ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=color+'22';ctx.fill();}
 },
 lineChart(canvas,series,opts={}){
  const ctx=canvas.getContext('2d'); const w=canvas.width=canvas.clientWidth*2,h=canvas.height=(opts.h||260)*2;
  ctx.clearRect(0,0,w,h); ctx.fillStyle=opts.bg||'#070b12';ctx.fillRect(0,0,w,h);
  const pad=36;
  // grille
  ctx.strokeStyle='#1a2333';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad+i*(h-2*pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-6,y);ctx.strokeStyle='#1a2333';ctx.stroke();}
  series.forEach(s=>{
   if(!s.data||s.data.length<2)return;
   const mn=s.min!=null?s.min:Math.min(...s.data), mx=s.max!=null?s.max:Math.max(...s.data)||1;
   ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2.4;
   s.data.forEach((v,i)=>{const x=pad+i/(s.data.length-1)*(w-pad-6);const y=h-pad-((v-mn)/((mx-mn)||1))*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
   ctx.stroke();
  });
 },

 /* renderLive : met à jour en continu la page active sans tout reconstruire */

  if(p==='dashboard') this.liveDashboard();

  else if(p==='cylinders') this.liveCylinders();
  else if(p==='ecu') this.liveEcu();
  else if(p==='synoptic') this.liveSynoptic();
  else if(p==='transmission') this.liveTransmission();
  else if(p==='emissions') this.liveEmissions();
  else if(p==='compare') this.drawCompare();
  else if(p==='combine') this.liveCombine();
  else if(p==='valise') this.liveValise();
  else if(p==='enquete') this.liveEnquete();
  else if(p==='accueil') this.liveAccueil();
  else if(p==='replay'&&s.replayPlaying) this.tickReplay();
 },

 ],
 setTune(key,val){ const t=this.state.tune; const d=this.TUNE_DEF.find(x=>x[0]===key); val=parseFloat(val); if(d){val=Math.max(d[2],Math.min(d[3],val));} t[key]=val; const el=document.getElementById('tn-'+key); if(el)el.textContent=val.toFixed(2)+'×'; this.saveState(); },
 toggleAutoShift(){ this.state.tune.autoShift=!this.state.tune.autoShift; this.toast('Boîte '+(this.state.tune.autoShift?'automatique':'manuelle')); this.go(this._currentPage); },

 },
 applyPreset(name){ const p=this.TUNE_PRESETS[name]; if(!p)return; const as=this.state.tune.autoShift; this.state.tune={...p.t,autoShift:as}; this.saveState(); this.toast('Préréglage : '+p.nom); this.go(this._currentPage); },
 _presetBar(){ return `<div class="card"><div class="ch"><span class="ic">🎛️</span>Préréglages de comportement</div><div class="row" style="flex-wrap:wrap;gap:8px">${Object.entries(this.TUNE_PRESETS).map(([k,p])=>`<button class="btn sm" onclick="App.applyPreset('${k}')">${p.ic} ${p.nom}</button>`).join('')}</div><p class="note" style="margin-top:8px">Un clic applique un jeu complet de réglages. Tu peux ensuite ajuster chaque curseur.</p></div>`; },
 _tuneSlider([key,label,min,max,step]){ const v=this.state.tune[key]!=null?this.state.tune[key]:1;

 /* ---------- CAPTEURS ---------- */
 SENS_CATS:{sync:'Synchronisation',air:'Admission / air',thermique:'Thermiques',carburant:'Carburant',richesse:'Richesse / combustion',mecanique:'Mécanique / véhicule',distrib:'Distribution variable',emissions:'Émissions',elec:'Électrique'},

 /* ---------- ÉLECTRIQUE DES CAPTEURS ---------- */
 _sensFrac(c,v){ return Math.max(0,Math.min(1,(v-c.min)/((c.max-c.min)||1))); },
 _sensElecLive(c,v){ // renvoie {txt, sub} : lecture électrique en direct
  const e=SENS_ELEC[c.ac]; if(!e) return {txt:'—',sub:''};
  const s=this.state, frac=this._sensFrac(c,v);
  switch(e.kind){
   case 'an': return {txt:(e.lo+frac*(e.hi-e.lo)).toFixed(2)+' V', sub:''};
   case 'ntc':{ const volt=e.hi-frac*(e.hi-e.lo); const ohm=Math.round(30000*Math.pow(0.5,frac*5)+200); return {txt:volt.toFixed(2)+' V', sub:'≈ '+ohm.toLocaleString('fr-FR')+' Ω'}; }
   case 'hall':{ const f=Math.round((c.ac==='CMP'?s.rpm/120:c.ac.startsWith('Roue')?s.speed*8:s.rpm*58/60)); return {txt:(s.engineRunning||s.speed>0)?'0 / 5 V':'0 V', sub:f+' Hz'}; }
   case 'ind':{ const amp=(s.rpm/s.rpmMax*4).toFixed(1); return {txt:'± '+amp+' V', sub:Math.round(s.rpm*58/60)+' Hz'}; }
   case 'freq':{ const f=Math.round(c.ac==='N-Turbo'?v*180:v*12); return {txt:f+' Hz', sub:'0 / 5 V'}; }
   case 'narrow':{ const volt=Math.max(0.05,Math.min(0.95, 0.45-(s.lambda-1)*1.8)); return {txt:volt.toFixed(2)+' V', sub:s.lambda<0.99?'riche':s.lambda>1.01?'pauvre':'λ≈1'}; }
   case 'wide':{ const i=((s.afr-(s.fuel==='diesel'?14.5:14.7))*0.4).toFixed(2); return {txt:i+' mA', sub:'courant pompe'}; }
   case 'piezo':{ const mv=Math.round(20+s.knock*1.4+(s.engineRunning?Math.random()*8:0)); return {txt:'± '+mv+' mV', sub:'signal AC'}; }
   case 'thermo':{ const mv=(v*0.041).toFixed(1); return {txt:mv+' mV', sub:'thermocouple'}; }
   case 'volt': return {txt:v.toFixed(2)+' V', sub:''};
   case 'res':{ if(c.ac==='Niv'){const ohm=Math.round(e.hi-frac*(e.hi-e.lo));return {txt:ohm+' Ω', sub:''};} if(c.ac==='I-alt')return {txt:Math.round(v)+' A', sub:'shunt'}; return {txt:Math.round(v)+' %', sub:''}; }
   case 'calc': return {txt:'bus CAN', sub:'valeur interne'};
   default: return {txt:'—',sub:''};
  }
 },
 _waveSVG(kind){
  const paths={
   an:'M0,15 C14,5 22,5 30,11 S50,16 64,9', volt:'M0,10 L64,10', wide:'M0,12 C20,12 28,7 64,8',
   ntc:'M0,4 C22,5 40,15 64,16', narrow:'M0,15 C6,3 14,3 20,15 S34,3 40,15 S54,3 60,15',
   hall:'M0,16 L0,4 L14,4 L14,16 L30,16 L30,4 L44,4 L44,16 L60,16 L60,4 L64,4',
   freq:'M0,16 L4,16 L4,4 L8,4 L8,16 L26,16 L26,4 L30,4 L30,16 L48,16 L48,4 L52,4 L52,16 L64,16',
   ind:'M0,10 Q8,1 16,10 T32,10 T48,10 T64,10',
   piezo:'M0,15 L8,15 L10,4 L12,15 L26,15 L28,6 L30,15 L46,15 L48,3 L50,15 L64,15',
   thermo:'M0,16 L64,5', calc:'M0,10 L64,10', res:'M0,13 L20,13 L24,7 L40,7 L44,13 L64,13',
  };
  const dash = kind==='calc'?'stroke-dasharray="3 3"':'';
  return `<svg viewBox="0 0 64 20" width="58" height="18" style="flex:none"><path d="${paths[kind]||paths.an}" fill="none" stroke="var(--accent)" stroke-width="1.6" ${dash} stroke-linecap="round" stroke-linejoin="round"/></svg>`;
 },

 page_sensors(){
  const aide=MODES[this.state.mode].aide;
  let h=this._ph('Capteurs & sondes','Valeurs instantanées, état, plage normale et injection de pannes par capteur.','Mesures')+
   `<div class="card" style="margin-bottom:12px"><div class="row">
     <span class="badge teal">Cohérence capteurs <b id="sc-score">100%</b></span>
     <input type="text" id="sens-search" placeholder="Rechercher un capteur..." style="max-width:220px" oninput="App._sensFilter(this.value)">
     <button class="btn sm" onclick="App.state.sensorFaults={};App.go('sensors')">↺ Tout réparer</button>
     ${aide?'<span class="tag" style="margin-left:auto">Mode pédagogique : survolez ? pour le rôle de chaque capteur</span>':''}
    </div></div>`;
  this._sensHist=this._sensHist||{};
  // récap par type de signal
  const byKind={}; CAPTEURS.forEach(c=>{const k=(SENS_ELEC[c.ac]||{}).kind||'calc';byKind[k]=(byKind[k]||0)+1;});
  h+=`<div class="card" style="margin-bottom:12px"><div class="ch"><span class="ic">🔌</span>Types de signaux présents</div><div class="row" style="flex-wrap:wrap;gap:6px">`;
  Object.entries(byKind).forEach(([k,n])=>h+=`<span class="tag">${this._waveSVG(k)} ${SIG_LABEL[k]||k} ×${n}</span>`);
  h+=`</div></div>`;
  Object.entries(this.SENS_CATS).forEach(([cat,lbl])=>{
   const list=CAPTEURS.filter(c=>c.cat===cat); if(!list.length)return;
   h+=`<div class="eyebrow" style="margin:14px 0 8px">${lbl}</div><div class="grid g4 sens-group">`;
   list.forEach(c=>{
    this._sensHist[c.ac]=this._sensHist[c.ac]||[];
    const e=SENS_ELEC[c.ac]||{kind:'calc',tech:'—',w:0,lo:0,hi:0};
    const vr = e.kind==='ntc'?`${e.lo}–${e.hi} V (inv.)` : e.kind==='thermo'?'0–'+(e.hi*1000).toFixed(0)+' mV' : e.kind==='hall'||e.kind==='freq'?'0 / 5 V' : e.kind==='calc'?'— (CAN)' : e.kind==='res'&&c.ac==='Niv'?e.lo+'–'+e.hi+' Ω' : `${e.lo}–${e.hi} ${e.kind==='volt'?'V':e.kind==='wide'?'mA':e.kind==='res'?(c.ac==='I-alt'?'A':'%'):'V'}`;
    h+=`<div class="sensor" data-ac="${c.ac}" data-nm="${(c.ac+' '+c.nom).toLowerCase()}">
     <div class="top"><div><div class="ac">${c.ac} <span class="help-q" title="${c.desc.replace(/"/g,'')}">?</span></div><div class="nm">${c.nom}</div></div><span class="st" id="st-${c.ac}">—</span></div>
     <div class="vrow"><span class="v" id="sv-${c.ac}">0</span><span class="u">${c.u}</span></div>
     <canvas id="sk-${c.ac}"></canvas>
     <div class="bar"><i id="sb-${c.ac}"></i></div>
     <div class="meta"><span>${c.min}</span><span>plage normale</span><span>${c.max}</span></div>
     <div class="selec">
       <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:3px"><span class="sk-lbl">${SIG_LABEL[e.kind]||e.kind}</span>${this._waveSVG(e.kind)}</div>
       <div class="erow"><span>Signal</span><b id="se-${c.ac}">—</b></div>
       <div class="erow"><span>Plage élec.</span><b>${vr}</b></div>
       <div class="erow"><span>Techno · fils</span><b>${e.tech} · ${e.w?e.w+' fils':'—'}</b></div>
     </div>
     ${aide?`<div class="note" style="font-size:10px">${c.desc}</div>`:''}
     <div class="actbar"><select class="btn xs" style="flex:1" onchange="App.injectSensorFault('${c.ac}',this.value)">
      <option value="none" ${!this.state.sensorFaults[c.ac]?'selected':''}>✔ Sain</option>
      ${Object.entries(this.FAULT_NAMES).map(([k,n])=>`<option value="${k}" ${this.state.sensorFaults[c.ac]===k?'selected':''}>⚠ ${n}</option>`).join('')}
     </select></div>
    </div>`;
   });
   h+='</div>';
  });

 _scopePhase:0,
 drawScope(){
  const cv=document.getElementById('scope-cv'); if(!cv)return;
  const s=this.state;
  const w=cv.width=cv.clientWidth*2, h=cv.height=cv.clientHeight*2;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#05080e'; ctx.fillRect(0,0,w,h);
  // grille
  ctx.strokeStyle='#11192a'; ctx.lineWidth=1;
  for(let x=0;x<=20;x++){ctx.beginPath();ctx.moveTo(x/20*w,0);ctx.lineTo(x/20*w,h);ctx.stroke();}
  for(let y=0;y<=10;y++){ctx.beginPath();ctx.moveTo(0,y/10*h);ctx.lineTo(w,y/10*h);ctx.stroke();}
  const chans=s.scopeCh;
  if(!chans.length){ ctx.fillStyle='#43506b';ctx.font='28px Inter';ctx.textAlign='center';ctx.fillText('Aucune voie sélectionnée',w/2,h/2);ctx.textAlign='left';return; }
  if(!s.scopePaused) this._scopePhase+=(s.rpm/600)+0.4;
  const ph=this._scopePhase;
  const rowH=h/chans.length;
  const N=360;
  chans.forEach((ci,idx)=>{
   const sg=this.SCOPE_SIG[ci];
   const y0=idx*rowH, yc=y0+rowH/2, amp=rowH*0.34;
   // séparateur + label
   ctx.strokeStyle='#1c2740';ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(w,y0);ctx.stroke();
   ctx.fillStyle=sg.color;ctx.font='600 22px Inter';ctx.fillText(sg.nom,12,y0+26);
   ctx.beginPath(); ctx.strokeStyle=sg.color; ctx.lineWidth=2.4;
   for(let i=0;i<N;i++){
    const x=i/(N-1)*w; const t=i/N*8 + ph*0.02; let v=0;
    const fx=(s.activeScenario&&s.activeScenario.fx)||{};
    switch(sg.type){
     case 'analog':{ // CKP : sinus + dent manquante
      const teeth=18, pos=(t*teeth)%teeth; v=Math.sin(t*teeth*Math.PI*2)*0.9;
      if(pos>teeth-1.6&&pos<teeth-0.4)v=0; // dent manquante
      if(s.sensorFaults['CKP']==='open'||fx.noStart)v=(Math.random()-0.5)*0.05;
      break;}
     case 'square':{ v=(Math.floor(t*1.5)%2)?0.85:-0.85; if(s.sensorFaults['CMP']==='open')v=-0.85; break;}
     case 'pulse':{ const period=2.0, dur=0.18+ s.injDuty/100*0.9; const pp=t%period; v=(pp<dur)?-0.9:0.6; if(!s.engineRunning)v=0.6; break;}
     case 'spark':{ const period=2.0, pp=t%period; if(pp<0.55)v=-0.2-pp*0.5; else if(pp<0.62)v=0.95; else v=0.6*Math.exp(-(pp-0.62)*6)*Math.cos((pp-0.62)*50); if(!s.engineRunning)v=0.6; break;}
     case 'level':{ let base=0; if(sg.id==='tps')base=s.throttlePlate/100; else if(sg.id==='map')base=s.map/250; else if(sg.id==='egr')base=s.egr/100; else if(sg.id==='maf')base=Math.min(1,s.maf/300); v=base*1.7-0.85; v+=(Math.random()-0.5)*0.02; break;}
     case 'lambda':{ const osc=Math.sin(t*3.2)* (s.ecuState.startsWith('idle')||s.ecuState==='partial'?0.7:0.2); v=osc - (s.lambda-1)*2; v=Math.max(-0.92,Math.min(0.92,v)); if(s.sensorFaults['λ-amont'])v=0.9; break;}
     case 'knock':{ const burst=(t*4)%1; const env=s.knock/100; v=(burst<0.18)? Math.sin(t*180)*(0.15+env*0.8) : Math.sin(t*180)*0.05; if(!s.engineRunning)v=0; break;}
     case 'volt':{ v=(s.vbat-13.5)*0.7; const fx2=(s.activeScenario&&s.activeScenario.fx)||{}; if(fx2.altRipple)v+=Math.sin(t*60)*0.55; else v+=Math.sin(t*22)*0.03; v=Math.max(-0.92,Math.min(0.92,v)); break;}
     case 'pwm':{ let duty=sg.id==='wg'?(s.wgDuty/100):(Math.min(1,(s.vvtIn||0)/40)); const period=0.8, pp=(t%period)/period; v=(pp<duty)?0.82:-0.82; if(!s.engineRunning)v=-0.82; break;}
     case 'square2':{ v=(Math.floor(t*1.5+0.5)%2)?0.8:-0.8; break;}
    }
    const yy=yc - v*amp; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy);
   }
   ctx.stroke();
  });
 },

  const lam=s.lambda, rich=Math.max(0,1-lam), lean=Math.max(0,lam-1);
  const co = s.engineRunning?(rich*9+0.3+ (s.combustion<70?2:0)).toFixed(2):'0.00';
  const hc = s.engineRunning?Math.round(rich*400+40+(s.combustion<70?180:0)+(s._misfireCyl?250:0)):0;
  const nox= s.engineRunning?Math.round(lean*900+ (s.egt>700?400:0)+ (s.egr<5&&s.load>60?300:0)+120):0;
  const co2= s.engineRunning?Math.round(120+s.load*1.4):0;
  const W=document.getElementById('emis-w');
  if(W){ const mk=(lbl,v,u,cls)=>`<div class="mw ${cls}"><div class="mw-l">${lbl}</div><div class="mw-v mono">${v}<small> ${u}</small></div></div>`;
   W.innerHTML=mk('CO',co,'%',co>3?'crit':co>1?'warn':'ok')+mk('HC',hc,'ppm',hc>300?'crit':hc>150?'warn':'ok')+mk('NOx',nox,'ppm',nox>800?'crit':nox>400?'warn':'ok')+mk('CO₂',co2,'g/km','ok'); }
  const sys=document.getElementById('emis-sys');
  if(sys){ const catLight=s.ect>350/10; const catOK=s.ect>200; // amorçage cata vers 200-300°C échappement
   sys.innerHTML=`<div class="kv"><span>Catalyseur</span><span class="badge ${s.egt>250?'green':'amber'}">${s.egt>250?'amorcé':'froid'}</span></div>
    <div class="kv"><span>Sonde λ amont</span><span class="badge ${s.sensorFaults['λ-amont']?'red':'green'}">${s.sensorFaults['λ-amont']?'défaut':'active'}</span></div>
    <div class="kv"><span>Sonde λ aval</span><span class="badge ${s.sensorFaults['λ-aval']?'red':'green'}">contrôle cata</span></div>
    <div class="kv"><span>Recyclage EGR</span><span class="mono">${Math.round(s.egr)} %</span></div>
    <div class="kv"><span>Boucle de régulation</span><span class="badge ${(s.ecuState==='partial'||s.ecuState.startsWith('idle'))?'green':'gray'}">${(s.ecuState==='partial'||s.ecuState.startsWith('idle'))?'fermée':'ouverte'}</span></div>`; }
  const fap=document.getElementById('emis-fap');
  if(fap){ const load=Math.round(s.fapLoad);
   fap.innerHTML=`<div class="kv"><span>Taux de suies</span><span class="mono">${load} %</span></div>
    <div class="bar" style="height:12px"><i style="display:block;height:100%;width:${load}%;background:${load>80?'var(--red)':load>50?'var(--amber)':'var(--green)'}"></i></div>
    <div class="kv" style="margin-top:8px"><span>État</span><span class="badge ${load>80?'red':load>50?'amber':'green'}">${load>80?'colmatage':load>50?'à surveiller':'propre'}</span></div>
    <div class="kv"><span>Régénération</span><span class="badge ${s._regen>0?'amber':'gray'}">${s._regen>0?'en cours':'inactive'}</span></div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">${s.fuel==='diesel'?'Régénération par élévation de l’EGT pour brûler les suies.':'FAP essence (GPF) sur injection directe.'}</div>`; }
  const cv=document.getElementById('emis-cv');
  if(cv){ const ctx=cv.getContext('2d');const w=cv.width=cv.clientWidth*2,h=cv.height=320;ctx.clearRect(0,0,w,h);
   const f=(x)=>x; // λ de 0.8 à 1.3
   const curves=[['#ef4444','CO/HC',l=>Math.max(0,1-l)*1.4+0.05],['#60a5fa','NOx',l=>Math.max(0,(l-0.95))*3.2],['#34d399','Puissance',l=>1-Math.abs(l-0.9)*1.1]];
   ctx.strokeStyle='#1a2333';for(let i=0;i<=4;i++){const y=i/4*h;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
   curves.forEach(([c,lbl,fn])=>{ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=2.4;for(let i=0;i<=80;i++){const l=0.8+i/80*0.5;const x=i/80*w;const y=h-Math.min(1,fn(l))*h*0.9-6;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();});
   // ligne lambda courant
   const lx=(Math.max(0.8,Math.min(1.3,lam))-0.8)/0.5*w; ctx.strokeStyle='#fff';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,h);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='#cdd6e6';ctx.font='18px Inter';ctx.fillText('λ='+lam.toFixed(2),lx+8,24);
  }
 },

 _gravBadge(g){ return g==='critique'?'red':g==='majeur'?'amber':'teal'; },
 page_faults(){

  if(!act.length) h+=`<div class="card" style="text-align:center;color:var(--text3);padding:26px">Aucun défaut actif. Le système ne signale aucune anomalie.</div>`;
  else { h+=`<div class="card" style="padding:0;overflow:hidden"><table><tr><th>Code</th><th>Description</th><th>Gravité</th><th>Occur.</th><th></th></tr><tbody>`;
   act.forEach(f=>{ h+=`<tr><td><b class="mono">${f.dtc}</b></td><td>${f.desc}</td><td><span class="badge ${this._gravBadge(f.grav)}">${f.grav}</span></td><td class="mono">${f.count}</td><td><button class="btn xs" onclick="App.go('freeze')">📷 Freeze frame</button></td></tr>`; });
   h+='</tbody></table></div>'; }
  if(sto.length){ h+=`<div class="eyebrow" style="margin:18px 0 8px">Historique mémorisé (effacés)</div><div class="card" style="padding:0;overflow:hidden"><table><tr><th>Code</th><th>Description</th><th>Gravité</th></tr><tbody>`;
   sto.slice(-12).reverse().forEach(f=>{ h+=`<tr style="opacity:.7"><td class="mono">${f.dtc}</td><td>${f.desc}</td><td><span class="badge gray">${f.grav}</span></td></tr>`; });
   h+='</tbody></table></div>'; }

   if(s._missionDone){

    if(aide) h+=`<button class="btn sm" style="margin-top:10px" onclick="App.useHint()">💡 Indice suivant (${s.missionHints}/3)</button>`;
    h+=`<div class="eyebrow" style="margin:14px 0 6px">Votre diagnostic</div>
     <div class="row" style="gap:8px"><select id="diag-guess" class="btn" style="flex:1">${SCENARIOS.map(x=>`<option value="${x.id}">${x.titre}</option>`).join('')}</select>
     <button class="btn pri" onclick="App.validateMission(document.getElementById('diag-guess').value)">Valider</button></div>`;
   }
   h+=`</div><div class="row" style="margin-top:10px;font-size:11px;color:var(--text3)">Astuce : utilisez les pages <b>Capteurs</b>, <b>Oscilloscope</b> et <b>Défauts</b> pour enquêter sans quitter la mission.</div>`;
   return h;
  }
  // bibliothèque
  const fd=s.misFilterDiff||'', fc=s.misFilterCat||'';

    </div></div>`;
  const cats={}; all.forEach(sc=>{(cats[sc.cat]=cats[sc.cat]||[]).push(sc);});
  if(!all.length) h+=`<div class="card" style="text-align:center;color:var(--text3);padding:24px">Aucun cas pour ce filtre.</div>`;
  Object.entries(cats).forEach(([cat,list])=>{

   list.forEach(sc=>{ const dc=sc.diff==='facile'?'green':sc.diff==='moyen'?'amber':'red';
    h+=`<div class="scn-card" onclick="App.startMission('${sc.id}')"><div class="row" style="justify-content:space-between"><b>${sc.titre}</b><span class="badge ${dc}">${sc.diff}</span></div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px;font-style:italic">${sc.client}</div>

   h+='</div>';
  });
  return h;
 },
 setMisFilter(type,val){ const s=this.state; if(type==='diff')s.misFilterDiff=val||''; else s.misFilterCat=val||''; this.go('missions'); },

 /* ============================================================
    RELEVÉS — lecture/analyse HORS LIGNE (aucune connexion réelle)
    ============================================================ */
 REPLAY_COLS:['rpm','speed','ect','map','boost','lambda','afr','vbat','rail','egt','knock','load','egr'],
 REPLAY_META:{rpm:{u:'tr/min',min:600,max:7000,nom:'Régime'},speed:{u:'km/h',min:0,max:200,nom:'Vitesse'},ect:{u:'°C',min:70,max:110,nom:'Temp. liquide'},map:{u:'kPa',min:20,max:240,nom:'MAP'},boost:{u:'bar',min:0,max:2,nom:'Suralim.'},lambda:{u:'λ',min:0.85,max:1.15,nom:'Lambda'},afr:{u:'',min:11,max:18,nom:'AFR'},vbat:{u:'V',min:13.2,max:14.8,nom:'Tension'},rail:{u:'',min:0,max:1800,nom:'Pression inj.'},egt:{u:'°C',min:200,max:850,nom:'Temp. échapp.'},knock:{u:'%',min:0,max:30,nom:'Cliquetis'},load:{u:'%',min:0,max:100,nom:'Charge'},egr:{u:'%',min:0,max:60,nom:'EGR'}},
 DEMO_REPLAYS:[
  {id:'r_ral',  nom:'Ralenti stable',        desc:'Moteur chaud au ralenti, tout est normal.', anom:null},
  {id:'r_froid',nom:'Démarrage à froid',     desc:'Montée en température, enrichissement initial.', anom:null},
  {id:'r_accel',nom:'Accélération franche',   desc:'Montée en charge et en régime régulière.', anom:null},
  {id:'r_trou', nom:'Trou à l’accélération',  desc:'Chute de régime en pleine accélération — à analyser.', anom:'rail'},
  {id:'r_carb', nom:'Chute de pression carburant', desc:'La pression rampe s’effondre en charge.', anom:'rail'},
  {id:'r_surp', nom:'Surpression turbo',      desc:'Pic de suralimentation au-delà de la cible.', anom:'boost'},
  {id:'r_bat',  nom:'Batterie faible',        desc:'Tension trop basse, charge insuffisante.', anom:'vbat'},
  {id:'r_lam',  nom:'Lambda instable',        desc:'Oscillations anormales de la sonde lambda.', anom:'lambda'},
  {id:'r_map',  nom:'MAP incohérent',         desc:'Pression collecteur incohérente avec le régime.', anom:'map'},
  {id:'r_knock',nom:'Cliquetis en charge',    desc:'Détection de cliquetis à haute charge.', anom:'knock'},
  {id:'r_chaud',nom:'Surchauffe progressive', desc:'Température qui dérive vers le haut.', anom:'ect'},
  {id:'r_egt',  nom:'EGT excessive',          desc:'Température d’échappement trop élevée.', anom:'egt'}
 ],
 _genReplay(def){
  const n=160, rows=[]; const A=def.anom;
  for(let i=0;i<n;i++){ const t=i/n;
   let rpm=850, speed=0, ect=90, map=35, boost=0, lambda=1, afr=14.7, vbat=14.2, rail=400, egt=300, knock=2, load=12, egr=8;
   if(def.id==='r_ral'){ rpm=850+Math.sin(i/4)*25; ect=89+Math.sin(i/20)*1; }
   else if(def.id==='r_froid'){ ect=20+t*70; rpm=1200-t*350+Math.sin(i/3)*40; lambda=0.88+t*0.12; afr=13-t*1.6+14.7*0; afr=12.8+t*1.9; rail=420; }
   else if(def.id==='r_accel'){ rpm=900+t*5200; speed=t*150; load=15+t*80; map=35+t*180; boost=t*1.1; egt=300+t*420; lambda=1-Math.max(0,t-0.6)*0.25; }
   else { // base accel profile then inject anomaly
    rpm=900+Math.min(1,t*1.4)*4800*(1-0.0); speed=Math.min(1,t*1.3)*120; load=15+Math.min(1,t*1.3)*78; map=35+Math.min(1,t*1.3)*170; boost=Math.min(1,t*1.3)*1.0; egt=300+Math.min(1,t*1.3)*380; }
   // anomalies

 _analyzeReplay(r){
  let h='<div class="g3" style="margin-bottom:10px">';

 _vin(id){

 /* ============================================================
    ENQUÊTE / JEU DE PISTE — diagnostic guidé par étapes
    ============================================================ */
 _shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; },
 _gameClue(sc){ // indice ciblé selon la famille de panne
  const m={A:'Concentre-toi sur la synchronisation et l\'alimentation au démarrage (PMH, pression, batterie).',
   B:'Le défaut se voit au ralenti : observe la richesse, l\'air et la régulation.',
   C:'Cherche du côté de l\'admission et de la suralimentation (boost, MAP, wastegate).',
   D:'Surveille la température et le refroidissement (ECT, ventilateurs).',
   E:'Piste électrique : tension, masse, alimentation 5 V.',
   F:'Combustion / carburant : richesse, rampe, injecteurs, cliquetis.',
   G:'Émissions et distribution variable : EGR, FAP, VVT.',
   H:'Le défaut vient d\'un capteur précis : compare sa valeur à sa plage normale.'};
  return m[(sc.cat||'A')[0]]||'Compare chaque paramètre suspect à sa plage normale.';
 },
 _familles(){ const seen=[]; SCENARIOS.forEach(s=>{ if(!seen.includes(s.cat))seen.push(s.cat); }); return seen.sort(); },
 setGameFilter(type,val){ const s=this.state; if(type==='diff')s.gameFilterDiff=val||''; else s.gameFilterCat=val||''; this.go('enquete'); },
 startGame(diff,cat){
  let pool=SCENARIOS.filter(s=>(!diff||s.diff===diff)&&(!cat||s.cat===cat));
  if(!pool.length) pool=SCENARIOS;
  const sc=pool[Math.floor(Math.random()*pool.length)];
  this.resetAll();
  this.applyScenario(sc,false);
  if(!sc.fx.noStart) this.startEngine();
  const opts=this._shuffle((sc.sus||[]).slice(0,Math.min(4,(sc.sus||[]).length)));
  this.state.invest={ id:sc.id, step:1, score:100, hints:[], wrong:[], picked:null, confirmed:false, opts, culprit:(sc.sus||['?'])[0], badge:null,
   t0:Date.now(), seen:[], diff:sc.diff, timeBonus:0, methodBonus:0 };
  this.log('info','Enquête lancée : '+sc.titre+' (panne cachée).');
  this.go('enquete');
 },
 gameStep(n){ if(this.state.invest){ this.state.invest.step=n; this.go('enquete'); } },
 gameHint(){ const g=this.state.invest; if(!g)return; const sc=SCENARIOS.find(s=>s.id===g.id);
  const clue=this._gameClue(sc); if(!g.hints.includes(clue)){ g.hints.push(clue); g.score=Math.max(0,g.score-15); this.toast('Indice (−15 pts)'); } this.go('enquete'); },
 // résout un suspect → capteur, actionneur, ou élément à contrôle manuel
 _resolveProbe(token){
  const c=CAPTEURS.find(x=>x.ac===token); if(c) return {type:'sensor',c};
  const a=(typeof ACTIONNEURS!=='undefined')?ACTIONNEURS.find(x=>x.ac===token):null; if(a) return {type:'act',a};
  return {type:'manuel'};
 },
 gameInspect(i){ const g=this.state.invest; if(!g)return; if(!g.seen.includes(i)){ g.seen.push(i); this.log('info','Contrôle de : '+g.opts[i]); } this.go('enquete'); },
 gameAnswer(choice){ const g=this.state.invest; if(!g)return;
  if(choice===g.culprit){ g.picked=choice; g.step=5; this.log('ok','Hypothèse correcte : '+choice+'.'); this.toast('Bonne piste !'); }
  else { if(!g.wrong.includes(choice)){ g.wrong.push(choice); g.score=Math.max(0,g.score-25); } this.toast('Mauvaise piste (−25 pts)'); }
  this.go('enquete'); },
 gameConfirm(ok){ const g=this.state.invest; if(!g)return; if(!ok){ g.score=Math.max(0,g.score-15); this.toast('Méthode peu rigoureuse (−15 pts)'); } else { g.confirmed=true; }
  // bonus rapidité
  const sec=(Date.now()-g.t0)/1000; g.timeSec=Math.round(sec);
  g.timeBonus = sec<60?15: sec<120?10: sec<210?5:0;
  // bonus méthode : avoir contrôlé le composant fautif avant de conclure
  const ci=g.opts.indexOf(g.culprit); g.methodBonus = (ci>=0 && g.seen.includes(ci))?10:0;
  g.base=g.score; g.score=Math.min(100, g.score+g.timeBonus+g.methodBonus);
  g.step=6; g.badge = g.score>=90?['Or','🥇','green']: g.score>=70?['Argent','🥈','teal']: g.score>=45?['Bronze','🥉','amber']:['À revoir','📘','gray'];
  this.log('ok','Enquête terminée — score '+g.score+'/100 ('+g.timeSec+' s).'); this.go('enquete'); },
 gameQuit(){ this.state.invest=null; this.clearFaults(); this.go('enquete'); },
 liveEnquete(){ const g=this.state.invest; if(!g)return;
  // chrono
  const ch=document.getElementById('game-chrono'); if(ch && g.step<6){ const s=Math.floor((Date.now()-g.t0)/1000); ch.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  // valeurs des suspects contrôlés (étape 3)
  if(g.step===3){ g.seen.forEach(i=>{ const tok=g.opts[i], pr=this._resolveProbe(tok); const el=document.getElementById('insp-'+i); const stt=document.getElementById('inspst-'+i); if(!el)return;
    if(pr.type==='sensor'){ const r=this.readSensor(pr.c); let v=r.v; let t=(Math.abs(v)<10&&!Number.isInteger(v))?v.toFixed(2):(Math.abs(v)<100?v.toFixed(1):Math.round(v)); el.textContent=t+' '+pr.c.u;
      if(stt){ const cl=r.status==='défaut'?'red':r.status==='alerte'?'amber':'green'; stt.className='badge '+cl; stt.textContent=r.status==='défaut'?'HORS PLAGE':r.status==='alerte'?'limite':'normal'; } }
    else if(pr.type==='act'){ el.textContent=Math.round(pr.a.get(this.state))+' '+pr.a.u; if(stt){stt.className='badge gray';stt.textContent='actionneur';} }
   }); }

 hook_theorie(){ this._decodePneu((document.getElementById('pneu-in')||{}).value||'205/55 R16 91V'); },
 _decodePneu(ref){
  const out=document.getElementById('pneu-out'); if(!out)return;
  const m=(ref||'').toUpperCase().match(/(\d{3})\s*\/\s*(\d{2})\s*R\s*(\d{2})\s*(\d{2,3})?\s*([A-Z])?/);
  if(!m){ out.innerHTML='<span class="badge amber">Format non reconnu</span> <span style="font-size:13px;color:var(--text3)">Exemple attendu : 205/55 R16 91V</span>'; return; }
  const larg=+m[1], serie=+m[2], jante=+m[3], charge=m[4], vit=m[5];
  const hFlanc=Math.round(larg*serie/100);
  const diamExt=Math.round(jante*25.4 + 2*hFlanc);
  const vitTable={Q:160,R:170,S:180,T:190,U:200,H:210,V:240,W:270,Y:300};
  const chargeTable={82:475,86:530,88:560,90:600,91:615,92:630,94:670,95:690,100:800};
  out.innerHTML=`<div class="grid g3">
    <div class="kv"><span>Largeur</span><b class="mono">${larg} mm</b></div>
    <div class="kv"><span>Série (h/L)</span><b class="mono">${serie} %</b></div>
    <div class="kv"><span>Hauteur du flanc</span><b class="mono">${hFlanc} mm</b></div>
    <div class="kv"><span>Structure</span><b class="mono">Radiale (R)</b></div>
    <div class="kv"><span>Diamètre jante</span><b class="mono">${jante}" (${Math.round(jante*25.4)} mm)</b></div>
    <div class="kv"><span>Diamètre extérieur ≈</span><b class="mono">${diamExt} mm</b></div>
    <div class="kv"><span>Indice de charge</span><b class="mono">${charge||'—'}${charge&&chargeTable[charge]?' ('+chargeTable[charge]+' kg)':''}</b></div>
    <div class="kv"><span>Indice de vitesse</span><b class="mono">${vit||'—'}${vit&&vitTable[vit]?' ('+vitTable[vit]+' km/h)':''}</b></div>
   </div>`;
 },

  CAPTEURS.slice(0,14).forEach(c=>{ h+=`<tr><td><b>${c.ac}</b> <span style="color:var(--text3);font-size:11px">${c.nom}</span></td><td style="font-size:12px;color:var(--text2)">${c.desc}</td></tr>`; });
  h+='</tbody></table></div>';
  h+=`<div class="eyebrow" style="margin:16px 0 8px">Glossaire</div><div class="g2">`;
  GLOSSAIRE.forEach(([t,d])=>{ h+=`<div class="card" style="padding:11px"><b style="color:var(--accent)">${t}</b><div style="font-size:12px;color:var(--text2);margin-top:3px">${d}</div></div>`; });
  h+='</div>';
  h+=`<div class="card" style="margin-top:14px;font-size:11px;color:var(--text3)">SimMoteur Pro — outil pédagogique pour la formation à la maintenance des véhicules (CAP / Bac Pro MV). Les valeurs, codes et comportements sont simplifiés à des fins d’apprentissage et ne remplacent pas la documentation constructeur.</div>`;
  return h;
 },

 /* ============================================================
    PARAMÈTRES
    ============================================================ */
 page_settings(){
  const s=this.state;
  let h=this._ph('Paramètres','Apparence, données de session et options de simulation.','Système');
  h+=`<div class="g2"><div class="card"><div class="ch"><b>Apparence</b></div>
    <div class="kv"><span>Thème</span><span class="row" style="gap:6px"><button class="btn xs ${s.theme!=='clair'?'pri':''}" onclick="App.setTheme('sombre');App.go('settings')">Sombre</button><button class="btn xs ${s.theme==='clair'?'pri':''}" onclick="App.setTheme('clair');App.go('settings')">Clair</button></span></div>
    <div class="kv"><span>Densité d'affichage</span><span class="row" style="gap:6px"><button class="btn xs ${!s.dense?'pri':''}" onclick="if(App.state.dense)App.toggleDensity();App.go('settings')">Confort</button><button class="btn xs ${s.dense?'pri':''}" onclick="if(!App.state.dense)App.toggleDensity();App.go('settings')">Compact</button></span></div>
    <div class="kv"><span>Menus latéraux</span><button class="btn xs" onclick="App.toggleAllGroups()">Replier / déplier</button></div>
   </div>
   <div class="card"><div class="ch"><b>Données de session</b></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="App.exportSession()">⬇ Exporter (JSON)</button>
     <label class="btn sm" style="cursor:pointer">⬆ Importer<input type="file" accept=".json" style="display:none" onchange="App.importSession(this)"></label>
     <button class="btn sm" onclick="App.exportCSV()">⬇ Données CSV</button></div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">La session est aussi sauvegardée automatiquement dans ce navigateur (localStorage).</div>
   </div></div>`;
  h+=`<div style="margin-top:12px">${this._presetBar()}</div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="ch"><b>Raccourcis clavier</b></div>
    <div class="grid g2" style="gap:6px">
     <div class="kv"><span>Accélérer / relâcher</span><b class="mono">↑ / ↓</b></div>
     <div class="kv"><span>Monter / descendre un rapport</span><b class="mono">G / B</b></div>
     <div class="kv"><span>Démarrer / couper le moteur</span><b class="mono">Espace</b></div>
     <div class="kv"><span>Coup de gaz</span><b class="mono">via combiné / tableau de bord</b></div>
    </div></div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="ch"><b>Simulation</b></div>
    <div class="kv"><span>Mode actuel</span><span class="badge ${(MODES[s.mode]||{}).badge||'gray'}">${(MODES[s.mode]||{}).nom||s.mode}</span></div>
    <div class="kv"><span>Véhicule</span><span>${this.veh().nom}</span></div>
    <div class="kv"><span>Points d’historique conservés</span><span class="mono">240</span></div>
   </div>`;
  h+=`<div class="card" style="margin-top:12px;border-color:var(--red)"><div class="ch"><b>Zone sensible</b></div>
    <div class="row" style="gap:8px"><button class="btn sm dng" onclick="App.resetAll()">🔄 Réinitialiser la session</button>
     <button class="btn sm dng" onclick="App.wipeStorage()">🗑 Effacer la sauvegarde locale</button></div></div>`;
  h+=`<div class="card" style="margin-top:12px;font-size:11px;color:var(--text3)">SimMoteur Pro · version ${this.VERSION} · fonctionne entièrement hors ligne dans le navigateur.</div>`;
  return h;
 },
 wipeStorage(){ try{localStorage.removeItem('simmoteur-v2');}catch(e){} this.toast('Sauvegarde locale effacée'); this.log('info','Sauvegarde locale effacée.'); },
 VERSION:'2.0'

}; /* fin App */

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
